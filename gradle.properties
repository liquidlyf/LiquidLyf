# Project-wide Gradle settings.
# Settings changed in Android Studio override this file.

# Memory: about 3-4 GB per build in total (Gradle + Kotlin daemons), so three Claude
# sessions can work on this PC at once. Run `./gradlew --stop` after big builds.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m

# Faster, repeatable builds.
org.gradle.caching=true
org.gradle.configuration-cache=true
# Leave CPU for the other sessions on this 8-core / 16-thread PC.
org.gradle.workers.max=6

android.useAndroidX=true
kotlin.code.style=official

# Firebase emulator host for the `demo` flavor. 127.0.0.1 works on a USB phone after
# `adb reverse tcp:8080 tcp:8080` and `adb reverse tcp:9099 tcp:9099`, and also on the
# Android emulator after the same commands. Override per machine in
# ~/.gradle/gradle.properties, e.g. liquidlyf.emulatorHost=10.0.2.2
liquidlyf.emulatorHost=127.0.0.1
