# Sends the resolved Gradle dependency graph to GitHub, which makes Dependabot alerts
# accurate for Kotlin and Android libraries (GitHub can't read a Gradle build statically).
name: dependency-submission

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  submit:
    name: submit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Use the dummy production Firebase config (no secrets)
        run: |
          mkdir -p app/src/prod
          cp .github/ci/google-services.prod-dummy.json app/src/prod/google-services.json

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
