# Lint, unit tests and builds for every pull request and push.
# Fork-PR safe: `pull_request` only (never pull_request_target), read-only token, no secrets.
# Actions are pinned to full commit SHAs; Dependabot keeps them current.
# No path filters on purpose: a required check skipped by `paths:` would block PRs forever.
# The Firebase rules and Worker jobs are added here when session B's packages land.
name: ci

on:
  pull_request:
  push:
    branches: [main, rebuild]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      # Also validates the Gradle wrapper. The cache is written only from main and rebuild.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/rebuild' }}

      - name: Use the dummy production Firebase config (no secrets)
        run: |
          mkdir -p app/src/prod
          cp .github/ci/google-services.prod-dummy.json app/src/prod/google-services.json

      - name: Lint, unit tests, demo APK and unsigned prod APK (R8 check)
        run: ./gradlew lintDemoDebug testDemoDebugUnitTest assembleDemoDebug assembleProdRelease --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

      - name: Upload the demo APK for reviewers
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-debug-apk
          path: app/build/outputs/apk/demo/debug/*.apk
          retention-days: 7
