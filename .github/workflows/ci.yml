# Lint, unit tests and builds for every pull request and push: the Android app,
# the Firestore rules and the admin scripts (on the emulators) and the Cloudflare Worker.
# Fork-PR safe: `pull_request` only (never pull_request_target), read-only token, no secrets.
# Actions are pinned to full commit SHAs; Dependabot keeps them current.
# No path filters on purpose: a required check skipped by `paths:` would block PRs forever.
name: ci

on:
  pull_request:
  push:
    branches: [main, rebuild]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      # Also validates the Gradle wrapper. The cache is written only from main and rebuild.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/rebuild' }}

      - name: Use the dummy production Firebase config (no secrets)
        run: |
          mkdir -p app/src/prod
          cp .github/ci/google-services.prod-dummy.json app/src/prod/google-services.json

      - name: Lint, unit tests, demo APK and unsigned prod APK (R8 check)
        run: ./gradlew lintDemoDebug testDemoDebugUnitTest assembleDemoDebug assembleProdRelease --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

      - name: Upload the demo APK for reviewers
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-debug-apk
          path: app/build/outputs/apk/demo/debug/*.apk
          retention-days: 7

  # Security rules tests (doc 07 §5 + the Spark tests), then the Worker end-to-end tests,
  # both on the Firebase emulators, which need Java 21.
  firebase-rules:
    name: firebase-rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            backend/worker/package-lock.json
            backend/admin-scripts/package-lock.json

      - run: npm ci

      - name: Rules tests on the Firestore emulator (project demo-liquidlyf, no account)
        run: npm run test:rules

      # Runs the emulators from firebase/ and the tests from backend/worker/, so it needs both installed.
      - name: Worker end-to-end tests (workerd + Auth/Firestore emulators, no account)
        working-directory: backend/worker
        run: |
          npm ci
          npm run test:e2e

      # Same: the emulators come from firebase/, the tests from backend/admin-scripts/.
      - name: Admin scripts tests (Admin SDK on the Auth/Firestore emulators, no account)
        working-directory: backend/admin-scripts
        run: |
          npm ci
          npm test

  # Cloudflare Worker unit tests (mocked Google endpoints). Nothing is deployed.
  worker:
    name: worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/worker/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Bundle check (wrangler dry run, no account)
        run: npm run build
