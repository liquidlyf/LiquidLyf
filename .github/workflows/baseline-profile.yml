# Makes the app's Baseline Profile (A32-5): baselineprofile/'s generator runs the demo build on a
# GitHub-hosted Android 14 emulator, against the Firebase emulators with the demo seed data.
# Started by hand: Actions → baseline-profile → Run workflow. It only uploads the profile as the
# `baseline-profile` artifact; commit its files into app/src/main/generated/baselineProfiles/.
# No secrets, a read-only token, nothing pushed. Actions are pinned to full commit SHAs.
name: baseline-profile

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-profile
  cancel-in-progress: true

jobs:
  generate:
    name: generate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Gradle and the Firebase emulators both need Java 21.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      # Auth on 9099 and Firestore on 8085, as in firebase/firebase.json. They keep running in the
      # background for the next steps. The seed's requests are dated "now", so the feed is full.
      - name: Firebase emulators with the demo seed data (project demo-liquidlyf, no account)
        working-directory: firebase
        run: |
          npm ci
          nohup npx firebase emulators:start --only auth,firestore --project demo-liquidlyf \
            > "$RUNNER_TEMP/firebase-emulators.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8085/ > /dev/null && curl -sf http://127.0.0.1:9099/ > /dev/null; then break; fi
            sleep 2
          done
          npm run seed

      # The Android emulator needs hardware acceleration (the action's README).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # No dev or prod Firebase config here, so only the demo variant is on: the one that can sign
      # in. 10.0.2.2 is this machine, as the Android emulator sees it.
      - name: Make the profile on an Android 14 emulator (English)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:generateBaselineProfile -Pliquidlyf.emulatorHost=10.0.2.2 --stacktrace

      - name: Upload the profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-profile
          path: app/src/main/generated/baselineProfiles/
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-profile-logs
          path: |
            ${{ runner.temp }}/firebase-emulators.log
            baselineprofile/build/outputs/
            baselineprofile/build/reports/
          retention-days: 7
