name: 🐞 Bug report
description: Something in the app, the security rules, the Worker or the website doesn't work as expected.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!

        **Never include real names, phone numbers, locations or other personal data.** Blur them in screenshots and remove them from logs.
        Found a **security** problem? Don't use this form; report it privately (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Open a request
        2. Tap "I can donate"
        3. Expected: … Actual: …
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Which build?
      options:
        - APK from GitHub Releases or the website
        - demoDebug (local emulators)
        - devDebug (maintainers' dev project)
        - Built from source in another way
        - Not about the app (rules, Worker, website)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: In the app, Settings → About.
      placeholder: "1.0.0 (1042)"
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      placeholder: "Samsung Galaxy A15, Android 15"
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - বাংলা (Bangla)
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or anything else
      description: Remove personal data first. Paste logs as text, not images.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal data (names, phone numbers, locations) from everything above.
          required: true
